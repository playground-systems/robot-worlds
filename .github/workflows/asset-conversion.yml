name: household-asset-conversion
on:
  pull_request:
    paths:
      - 'tools/decompose_asset.py'
      - 'src/robot_worlds/collision_preparation.py'
      - 'src/robot_worlds/collision_worker.py'
      - 'src/robot_worlds/sdf_import.py'
      - 'tests/test_collision_preparation*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/robot_worlds/assets/household/porcelain_bowl/**'
      - '.github/workflows/asset-conversion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decompose-bowl:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      ROBOT_WORLDS_TEST_PREPARATION: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Install conversion tooling
        run: python -m pip install uv==0.11.28
      - name: Convert original source surface
        shell: bash
        run: |
          uv sync --frozen --dev --extra preparation
          uv run --frozen --extra preparation pytest -q -ra -s tests/test_collision_preparation_native.py --basetemp "$RUNNER_TEMP/preparation-tests"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: prepared-collision-${{ matrix.os }}
          path: ${{ runner.temp }}/preparation-tests
          if-no-files-found: error
